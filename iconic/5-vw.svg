    <text x="540" y="347.36" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="19.98" fill="#1f5a45">The Ivy Bee</text>
    <line x1="519.7248" y1="361.4" x2="560.2752" y2="361.4" stroke="#c9a24a" stroke-width="2"/>
    <text x="540" y="384.08" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.88" letter-spacing="2" fill="#7a6a4a">BOTANICAL</text>
  </g><text x="120" y="900" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="84" fill="#111">Think small.</text><text x="120" y="1090" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#222">Our bottle won't turn heads</text><text x="120" y="1128" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#222">on your bathroom shelf. It's</text><text x="120" y="1166" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#222">just a bottle. What's inside is</text><text x="120" y="1204" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#222">the point: botanical shampoo,</text><text x="120" y="1242" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#222">conditioner and treatment that</text><text x="120" y="1280" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#222">quietly get on with the job.</text><text x="600" y="1090" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#222">Fewer harsh ingredients. More</text><text x="600" y="1128" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#222">of the good stuff. And a price</text><text x="600" y="1166" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#222">that doesn't pretend luxury</text><text x="600" y="1204" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#222">has to cost the earth.</text><text x="600" y="1242" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#222">Some shampoos shout.</text><text x="600" y="1280" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#222">Ours just works.</text><text x="120" y="1330" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="34" fill="#111">The Ivy Bee.</text><text x="960" y="1330" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="24" letter-spacing="1" fill="#555">Drawn from nature, made for your hair.</text><g transform="translate(960 880) scale(0.55)" fill="none" stroke="#111" stroke-linecap="round">
