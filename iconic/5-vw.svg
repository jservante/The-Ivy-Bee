    <text x="540" y="366.944" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.484" letter-spacing="2" fill="#7a6a4a">BOTANICAL</text>
  </g><text x="120" y="880" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="84" fill="#111">Think small.</text><text x="122" y="930" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="32" fill="#444">Drawn from nature, made for your hair.</text><text x="120" y="1050" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#222">Our bottle won't turn heads</text><text x="120" y="1088" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#222">on your bathroom shelf. It's</text><text x="120" y="1126" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#222">just a bottle. What's inside is</text><text x="120" y="1164" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#222">the point: botanical shampoo,</text><text x="120" y="1202" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#222">conditioner and treatment that</text><text x="120" y="1240" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#222">quietly get on with the job.</text><text x="600" y="1050" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#222">Fewer harsh ingredients. More</text><text x="600" y="1088" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#222">of the good stuff. And a price</text><text x="600" y="1126" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#222">that doesn't pretend luxury</text><text x="600" y="1164" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#222">has to cost the earth.</text><text x="600" y="1202" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#222">Some shampoos shout.</text><text x="600" y="1240" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#222">Ours just works.</text><text x="120" y="1318" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="34" fill="#111">The Ivy Bee.</text><rect x="678" y="1273" width="280" height="70" rx="35" fill="none" stroke="#111" stroke-width="2"/>
